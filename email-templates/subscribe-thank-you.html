<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Georgia,'Times New Roman',serif;color:#222;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f4;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e9ecef;">
          <tr>
            <td style="padding:28px 28px 16px;border-bottom:3px solid #ffc107;text-align:center;">
              <img src="https://www.doarti.com/images/logo-doarti.png" alt="Doarti" width="72" style="display:inline-block;margin-bottom:10px;" />
              <div style="font-size:20px;letter-spacing:0.12em;font-weight:700;color:#111;">DOARTI</div>
              <div style="font-size:11px;letter-spacing:0.08em;color:#666;margin-top:4px;">BY DZHEMILE AHMED</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 14px;font-size:24px;line-height:1.3;color:#111;">{{headline}}</h1>
              <p style="margin:0 0 14px;font-size:15px;line-height:1.7;color:#333;">{{intro}}</p>
              <p style="margin:0 0 18px;font-size:15px;line-height:1.7;color:#444;">{{body}}</p>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#444;">{{closing}}</p>
              <a href="{{cta_url}}" style="display:inline-block;background:#ffc107;color:#111;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;">{{cta_label}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#fafafa;border-top:1px solid #e9ecef;font-size:12px;line-height:1.6;color:#777;text-align:center;">
              © {{year}} {{site_name}} - <a href="https://www.doarti.com" style="color:#2563eb;text-decoration:none;">www.doarti.com</a><br />
              {{subscriber_email}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
